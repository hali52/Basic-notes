<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Notes</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #f4f4f5; color: #111; display: flex; flex-direction: column; height: 100vh; }
  header { background: #111; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header button { background: white; color: #111; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .wrap { display: flex; flex: 1; overflow: hidden; }
  aside { width: 260px; background: white; border-right: 1px solid #e4e4e7; display: flex; flex-direction: column; }
  aside input { margin: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  #list { overflow-y: auto; flex: 1; }
  .note-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
  .note-item.active { background: #eef2ff; }
  .note-item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item small { color: #888; }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; }
  #title { font-size: 22px; font-weight: 700; border: none; outline: none; background: transparent; padding: 8px 4px; }
  #editor { flex: 1; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.6; background: transparent; padding: 8px 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid #ddd; }
  .toolbar button { padding: 9px 14px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 600; }
  .toolbar button.danger { color: #dc2626; }
  #status { font-size: 12px; color: #16a34a; padding: 6px 2px; height: 18px; }
  @media (max-width: 700px) { aside { width: 120px; } header h1 { font-size: 16px; } }
</style>
</head>
<body>
<header>
  <h1>📝 Basic Notes</h1>
  <button onclick="newNote()">+ New Note</button>
</header>
<div class="wrap">
  <aside>
    <input id="search" placeholder="Search notes..." oninput="renderList()">
    <div id="list"></div>
  </aside>
  <main>
    <input id="title" placeholder="Note title..." oninput="autoSave()">
    <textarea id="editor" placeholder="Start writing here... Everything saves automatically on this device." oninput="autoSave()"></textarea>
    <div id="status">Saved ✓</div>
    <div class="toolbar">
      <button onclick="saveNote()">💾 Save</button>
      <button onclick="downloadNote()">⬇️ Download .txt</button>
      <button onclick="deleteNote()" class="danger">🗑️ Delete</button>
    </div>
  </main>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('basic-notes-v2') || '[]');
let currentId = null;
const titleEl = document.getElementById('title');
const editorEl = document.getElementById('editor');
const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');

function saveToStorage() {
  localStorage.setItem('basic-notes-v2', JSON.stringify(notes));
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  listEl.innerHTML = '';
  const filtered = notes.filter(n => (n.title + n.content).toLowerCase().includes(q));
  filtered.slice().reverse().forEach(n => {
    const div = document.createElement('div');
    div.className = 'note-item' + (n.id === currentId ? ' active' : '');
    div.onclick = () => openNote(n.id);
    div.innerHTML = `<b>${n.title || 'Untitled'}</b><small>${n.date || ''}</small>`;
    listEl.appendChild(div);
  });
}

function openNote(id) {
  currentId = id;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  titleEl.value = n.title;
  editorEl.value = n.content;
  renderList();
}

function newNote() {
  const n = { id: Date.now(), title: '', content: '', date: new Date().toLocaleString() };
  notes.push(n);
  currentId = n.id;
  titleEl.value = '';
  editorEl.value = '';
  titleEl.focus();
  saveToStorage();
  renderList();
}

function autoSave() {
  if (!currentId) { newNote(); }
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  n.title = titleEl.value;
  n.content = editorEl.value;
  n.date = new Date().toLocaleString();
  saveToStorage();
  renderList();
  statusEl.textContent = 'Saved ✓ ' + new Date().toLocaleTimeString();
}

function saveNote() {
  autoSave();
  alert('Saved locally on this device!');
}

function deleteNote() {
  if (!currentId) return;
  if (!confirm('Delete this note?')) return;
  notes = notes.filter(x => x.id !== currentId);
  saveToStorage();
  currentId = null;
  titleEl.value = '';
  editorEl.value = '';
  renderList();
}

function downloadNote() {
  const text = (titleEl.value + '\n\n' + editorEl.value) || 'Empty note';
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (titleEl.value || 'note') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

// Load on start
if (notes.length === 0) {
  notes = [{ id: Date.now(), title: 'Welcome', content: 'This is your first note.\n\nEverything you type saves automatically in this browser / iPhone.\n\nTap + New Note to create another.', date: new Date().toLocaleString() }];
  saveToStorage();
}
currentId = notes[notes.length - 1].id;
openNote(currentId);
renderList();
</script>
</body>
</html>
